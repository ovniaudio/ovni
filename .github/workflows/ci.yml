# =============================================================================================
# OVNI — CI (integración continua). En cada push/PR a main:
#   configura CMake (universal arm64+x86_64) → buildea las libs + plugins + runners de test →
#   corre ctest → corre tools/validate.sh por cada plugin del catálogo
#   (aurora/dust/halo/horizon/nebula/pulsar).
#
# Honestidad verificable (doctrina del sello): el CI NO es decorativo. Cada claim que publicamos
# (universal, pluginval lvl8, auval, anti-clip, mediciones house H7/H8/H9) lo re-mide acá en limpio.
# El validate-report.json de cada plugin queda archivado como artefacto: cualquiera lo puede auditar.
#
# Notas de entorno:
#   · runner macos-latest (arm64). El build sale universal (arm64;x86_64) por el preset/flag.
#   · pluginval se autodescarga dentro de validate.sh (puerta 3). auval corre nativo en el runner.
#   · NO firmamos ni notarizamos acá — eso es release.yml (requiere credenciales de Joaquín).
#   · Las deps de FetchContent (JUCE 8.0.13 / libmysofa v1.3.4 / Catch2 v3.8.1) se cachean por hash
#     del CMakeLists raíz: clonar JUCE en cada run es lo más caro del pipeline.
# =============================================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Un push nuevo a la misma rama/PR cancela el run anterior (no malgastamos minutos de macOS).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-validate:
    name: build + ctest + validate
    runs-on: macos-latest

    env:
      BUILD_DIR: ${{ github.workspace }}/build
      CONFIG: Release
      # Catálogo real (los 6 plugins con CMakeLists, sin contar el _probe que no se distribuye).
      PLUGINS: "aurora dust halo horizon nebula pulsar"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Toolchain: Ninja para builds rápidos (el CMake raíz documenta -G Ninja). ---
      - name: Instalar Ninja
        run: brew install ninja

      # --- Cache de las deps de FetchContent (JUCE/libmysofa/Catch2) ---
      # FetchContent clona en build/_deps/. Cacheamos esa carpeta keyed por el CMakeLists raíz:
      # si cambian los GIT_TAG (las versiones pineadas), la key cambia y se reclona limpio.
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-

      # --- Configurar (UNIVERSAL). Usa el preset release-universal de CMakePresets.json:
      #     fija CMAKE_OSX_ARCHITECTURES=arm64;x86_64 + Release + deployment target 11.0. ---
      - name: Configurar CMake (release-universal)
        run: cmake --preset release-universal

      # --- Build: todo el árbol (las 5 libs + los 6 plugins + los runners de test). ---
      - name: Build
        run: cmake --build build --config Release

      # --- ctest: corre el runner unificado [s1]+[s2]+[s3]+[gain] + los per-plugin. ---
      # Falla el job si algún test queda rojo (--output-on-failure muestra el detalle).
      - name: ctest
        run: ctest --test-dir build --output-on-failure --no-tests=error

      # --- validate.sh por cada plugin del catálogo. Re-mide TODAS las puertas en limpio
      #     (build→universal(lipo)→pluginval lvl8→auval→tests→anti-clip→H7/H8/H9) y emite el
      #     validate-report.json. Guardamos cada reporte y hacemos fallar el job si alguno NO está ok. ---
      - name: validate (aurora / dust / halo / horizon / nebula / pulsar)
        run: |
          set -uo pipefail
          mkdir -p reports
          rc=0
          for p in $PLUGINS; do
            echo "::group::validate $p"
            # validate.sh emite el JSON por stdout y devuelve exit 0 si TODO está verde, 1 si falla.
            if tools/validate.sh "$p" > "reports/validate-report-$p.json"; then
              echo "validate[$p]: VERDE"
            else
              echo "::error title=validate $p::puerta roja — ver reports/validate-report-$p.json"
              cat "reports/validate-report-$p.json" || true
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      # --- Archivar los reportes SIEMPRE (también cuando el job falla: ahí es cuando más sirven). ---
      - name: Archivar validate-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-reports
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 30

  # =============================================================================================
  # M6 — Windows (VST3). Build MSVC x64 en windows-latest + pluginval strictness 10 sobre los 6.
  # Ninguno de los 6 usa IPP → compila directo (JUCE 8.0.13 + libmysofa + MSVC). Windows = VST3
  # (JUCE omite AU). Sin firmar → SmartScreen (se distribuye como ZIP en el Release). Los tests
  # Catch2 quedan cubiertos por el job macOS de arriba; acá desactivamos OVNI_BUILD_TESTS para ir
  # directo al entregable (los .vst3 x64) y no arrastrar Catch2 a MSVC.
  # =============================================================================================
  windows:
    name: build VST3 x64 + pluginval (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Catálogo real (los 6 plugins con CMakeLists; _probe no se distribuye).
      PLUGINS: "aurora dust halo horizon nebula pulsar"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache de las deps de FetchContent (JUCE 8.0.13 / libmysofa / — Catch2 no, tests OFF).
      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-

      - name: Configurar (Visual Studio 2022, x64, sin tests)
        run: >
          cmake -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DOVNI_BUILD_TESTS=OFF .

      - name: Build los 6 VST3
        run: >
          cmake --build build --config Release --target
          aurora_VST3 dust_VST3 halo_VST3 horizon_VST3 nebula_VST3 pulsar_VST3

      - name: Verificar PE x64 (los 6, COFF machine = AMD64)
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Recurse -Directory -Path build -Filter *.vst3 |
                     Where-Object { $_.FullName -match '_artefacts' }
          Write-Host "Bundles .vst3 encontrados: $($bundles.Count)"
          if ($bundles.Count -lt 6) { Write-Error "Esperaba 6 VST3, encontré $($bundles.Count)"; exit 1 }
          foreach ($b in $bundles) {
            $bin = Get-ChildItem -Recurse -File -Path $b.FullName -Filter *.vst3 | Select-Object -First 1
            $bytes  = [System.IO.File]::ReadAllBytes($bin.FullName)
            $peOff  = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOff + 4)
            Write-Host ("{0}: 0x{1:X4}" -f $bin.Name, $machine)
            if ($machine -ne 0x8664) { Write-Error "$($bin.Name) no es x64"; exit 1 }
          }
          Write-Host "OK: 6 VST3 PE x64 (AMD64)"

      - name: Pluginval (strictness 10, los 6)
        run: |
          set -uo pipefail
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          rc=0
          for b in $(find build -type d -path '*_artefacts/*/VST3/*.vst3'); do
            echo "::group::pluginval $b"
            if ./pluginval.exe --strictness-level 10 --validate "$b"; then
              echo "pluginval[$b]: PASS"
            else
              echo "::error title=pluginval::falló $b"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Subir los 6 VST3 (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ovni-windows-vst3
          path: build/plugins/*/*_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
